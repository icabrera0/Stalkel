<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Stalkie</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/apps.css">
</head>
<body>
  <div id="app">
    <div class="menu-screen">
      <div class="menu-content"></div>
    </div>

    <div class="phone-wrap">
      <!-- Side hardware buttons (decorative) -->
      <div class="phone-sides-left">
        <div class="side-btn silent-switch"></div>
        <div class="side-btn vol-up"></div>
        <div class="side-btn vol-down"></div>
      </div>
      <div class="phone-sides-right">
        <div class="side-btn power-btn"></div>
      </div>

      <div class="phone">
        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>

        <!-- Status Bar -->
        <div class="status-bar">
          <div class="status-bar-left">
            <span class="status-time">9:41</span>
          </div>
          <div class="status-bar-right">
            <div class="signal-bars">
              <span></span><span></span><span></span><span></span>
            </div>
            <svg class="wifi-icon" viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg" fill="none">
              <circle cx="8" cy="11" r="1.3" fill="white"/>
              <path d="M4.2 7.8A5.3 5.3 0 0 1 11.8 7.8" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M1.2 4.8A9.2 9.2 0 0 1 14.8 4.8" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <div class="battery-icon">
              <div class="battery-fill"></div>
              <div class="battery-cap"></div>
            </div>
          </div>
        </div>

        <div class="screen">
          <div class="home-screen">
            <div class="home-time" id="home-time">9:41</div>
            <div class="home-date" id="home-date">Wednesday</div>

            <div class="app-grid">
              <div class="app-icon" data-app="instagram">
                <div class="icon-img" style="background: linear-gradient(135deg, #833AB4, #E1306C, #F77737);">
                  <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="6" ry="6"/>
                    <circle cx="12" cy="12" r="5"/>
                    <circle cx="17.5" cy="6.5" r="1.2" fill="white" stroke="none"/>
                  </svg>
                </div>
                <span>Instagram</span>
              </div>
              <div class="app-icon" data-app="whatsapp">
                <div class="icon-img" style="background: #25D366;">
                  <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                  </svg>
                </div>
                <span>WhatsApp</span>
              </div>
              <div class="app-icon" data-app="revolut">
                <div class="icon-img" style="background: #191c82;">
                  <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                    <rect x="4" y="10" width="16" height="2" fill="white" opacity="0.9"/>
                    <text x="6" y="15.5" font-size="6" fill="#191c82" font-weight="bold" font-family="sans-serif">rev</text>
                  </svg>
                </div>
                <span>Revolut</span>
              </div>
              <div class="app-icon" data-app="twitter">
                <div class="icon-img" style="background: #000;">
                  <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                  </svg>
                </div>
                <span>Twitter</span>
              </div>
              <div class="app-icon" data-app="maps">
                <div class="icon-img" style="background: linear-gradient(160deg, #34A853, #4285F4);">
                  <svg viewBox="0 0 24 24" width="30" height="30">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white"/>
                    <circle cx="12" cy="9" r="2.5" fill="#34A853"/>
                  </svg>
                </div>
                <span>Maps</span>
              </div>
              <div class="app-icon" data-app="gallery">
                <div class="icon-img" style="background: #1c1c1e; border: 1px solid rgba(255,255,255,0.1);">
                  <svg viewBox="0 0 24 24" width="30" height="30">
                    <rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="white" stroke-width="1.5"/>
                    <circle cx="8" cy="8" r="2" fill="#FFCC00"/>
                    <path d="M2 15l5-5 4 4 3-3 8 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  </svg>
                </div>
                <span>Galería</span>
              </div>
              <div class="app-icon" data-app="messages">
                <div class="icon-img" style="background: linear-gradient(135deg, #34C759, #30D158);">
                  <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                  </svg>
                </div>
                <span>Mensajes</span>
              </div>
            </div>
          </div>
        </div>

        <div class="phone-bottom-bar">
          <button class="btn-back">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <div class="home-indicator"></div>
          <button class="btn-evidence">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            <span class="evidence-badge" style="display:none;"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="camera-flash"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
